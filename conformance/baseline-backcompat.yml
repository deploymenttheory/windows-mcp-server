# Expected failures for the BACKWARD-COMPATIBILITY pass, at protocol 2025-11-25.
#
#   npx @modelcontextprotocol/conformance server \
#     --url http://127.0.0.1:3003/mcp --suite all --spec-version 2025-11-25 \
#     --expected-failures conformance/baseline-backcompat.yml
#
# This pass exists to show that a client still negotiating 2025-11-25 is served
# correctly. It needs its own baseline rather than reusing the fixtures one: a
# different protocol revision has a different applicable scenario set, and several
# scenarios here were removed outright at 2026-07-28.
#
# Everything below is a feature the server does not implement, for reasons that
# have nothing to do with protocol compliance.

server:
  # Roots, sampling and logging are deprecated by SEP-2577 as of 2026-07-28, with
  # the guidance that new implementations should not adopt them. This server never
  # did: it logs to stderr or a file, and it does not call back into the client.
  - tools-call-with-logging
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums

  # The host runs the SDK's stateless transport, which is the 2026-07-28 model:
  # no sessions, no GET stream, and therefore no SSE polling or resumption. A
  # 2025-11-25 client gets correct answers to everything it asks over POST; what
  # it does not get is the long-lived GET stream that revision also allowed.
  - server-sse-polling
  - server-sse-multiple-streams

  # resources/subscribe and resources/unsubscribe were replaced by
  # subscriptions/listen at 2026-07-28 (SEP-2575). The server implements the
  # replacement, not the pair it replaced.
  - resources-subscribe
  - resources-unsubscribe

  # SEP-2243 custom headers via x-mcp-header: needs a tool declaring a parameter
  # sourced from a custom header, and no tool here does.
  - http-custom-header-server-validation

  # SEP-1613 keyword preservation is NOT listed: this pass runs with --fixtures,
  # so json_schema_2020_12_tool is present and the scenario genuinely passes.
