# Windows build targets for windows-mcp-server. The production workflow runs
# GoReleaser with archive/sign/publish/SBOM pipes skipped, then Azure-signs the
# PE files and packages those exact signed bytes with package-release.ps1.
#
# The server is pure Go — the Win32/UIA/WMI bindings are syscall-based, with no
# cgo anywhere — so both Windows targets build from one runner rather than
# needing a machine per arch. That is the same property the CI build matrix
# relies on (it cross-compiles the arm64 build from the amd64 runner).
version: 2

project_name: windows-mcp-server

before:
  hooks:
    - go mod download

builds:
  - id: windows-mcp-server
    main: ./cmd/windows-mcp-server
    binary: windows-mcp-server
    env:
      # No cgo: every binding is syscall-based. Setting it explicitly keeps a
      # cgo-enabled runner from producing binaries that will not run elsewhere.
      - CGO_ENABLED=0
    # Windows-only by design: nearly every file is //go:build windows, and the
    # transport is stdio. amd64 and arm64 are the two supported architectures,
    # asserted by the (amd64 || arm64) build tag across the tree.
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # -s -w drop the symbol and DWARF tables a released binary does not need.
      # The version is stamped into main.version so `--version` names the tag it
      # was cut from rather than the "dev" default in main.go.
      - -s -w
      - -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: windows-mcp-server
    ids: [windows-mcp-server]
    # Retained for local GoReleaser snapshots; production ZIPs are assembled
    # after Authenticode signing.
    # A predictable name: windows-mcp-server_1.1.0_windows_arm64.zip.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [zip]
    files:
      - README.md
      - LICENSE
      # The starting-point policy documents ship alongside the binary so an
      # operator has something to point --policy-config at on first run.
      - policy/examples/*.json

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Local snapshots can generate SBOMs here. The release workflow generates SBOMs
# after it has repackaged the signed executables.
sboms:
  - id: archives
    artifacts: archive

# Local snapshots can sign their checksums here. Production signs the checksums
# after packaging, so the released hashes cover the Authenticode-signed bytes.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # release-please writes CHANGELOG.md from the conventional commits and owns
  # the release notes; duplicating them here would only disagree with it.
  disable: true

release:
  # The workflow publishes only after signing and verifying every package.
  disable: true
