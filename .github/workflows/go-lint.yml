name: go | Linter

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/go-lint.yml'
      - '.golangci.yml'
      - '**/*.go'

permissions:
  contents: read
  pull-requests: write  # Needed for "only-new-issues" and commenting on PR
  issues: write  # Needed for commenting on PR

jobs:
  golint:
    name: '✨ Run golangci-lint'
    # Windows-only by design: nearly every file carries
    # `//go:build windows && (amd64 || arm64)`, so on a Linux runner golangci-lint
    # would exclude almost the whole codebase from analysis. harden-runner is not
    # used here — it supports Linux runners only.
    runs-on: windows-latest

    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Get full history for full merge-base detection
      
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          # No --issues-exit-code=0: lint gates the PR. Safe because .golangci.yml
          # sets new: true with new-from-merge-base: main, so only new issues surface.
          args: --timeout=30m --verbose --config=./.golangci.yml
          only-new-issues: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-cache: false              # restore and save cache
          skip-save-cache: false         # allow saving any new cache
          cache-invalidation-interval: 7 # auto-invalidate (refresh) once per week
      
      # Save artifacts on failure
      - name: Save artifacts
        if: failure()
        shell: bash # POSIX idioms below; the default shell on windows runners is pwsh
        run: |
          mkdir -p wr_actions
          echo ${{ github.repository_owner }} > wr_actions/ghowner.txt
          echo ${{ github.event.repository.name }} > wr_actions/ghrepo.txt
          echo ${{ github.event.pull_request.number }} > wr_actions/prnumber.txt
      
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: wr_actions
      
      # Comment on failure
      - name: Get run url
        if: failure()
        shell: bash # $GITHUB_ENV append idiom below
        run: |
          echo "gha_url=https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}" >> $GITHUB_ENV
          
      - name: Send build failure comment
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '<b>Build failure</b> \n\n This pull request contains a build failure which needs addressed [here](${{ env.gha_url}}) .'
            })