# Builds and attaches the release binaries when release-please tags a release.
#
# release-please owns the version, the changelog and the GitHub release itself;
# this only builds the artifacts and appends them. Splitting it that way means a
# failure here leaves the release intact rather than half-made, and it can be
# re-run without re-tagging.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: 📦 Build and sign release archives
    runs-on: windows-latest
    permissions:
      # Attaching the archives to the release.
      contents: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate naming this workflow, so the signature says which workflow
      # in which repository produced the artifact.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag, which needs the tags
          # and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # syft produces the per-archive SBOMs the goreleaser `sboms` block emits.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}