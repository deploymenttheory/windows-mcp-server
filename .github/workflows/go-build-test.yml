name: go | Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/go-build-test.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  build-test:
    name: '🧪 Build & Test (windows)'
    # Windows-only by design: nearly every file carries
    # `//go:build windows && (amd64 || arm64)`, so a Linux runner would compile
    # almost nothing. Note step-security/harden-runner is not used here — it
    # supports Linux runners only; the security posture is SHA-pinned actions
    # plus minimal permissions.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Verify modules and tidiness
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      # The agentweave-harness dependency is developed in lockstep with this
      # repo, so working branches may point it at a local checkout. A replace
      # directive that reaches main would make releases build against code no
      # tag describes — refuse it here.
      - name: Refuse replace directives
        shell: bash
        run: |
          if grep -E '^replace ' go.mod; then
            echo 'go.mod carries a replace directive; pin a published tag instead.' >&2
            exit 1
          fi

      - name: Build (amd64)
        run: go build ./...

      - name: Vet
        # unsafeptr is disabled: the low-level input hooks (journeyhook_windows.go)
        # must convert the OS-supplied uintptr lParam to a struct pointer — the
        # legitimate, unavoidable hook idiom, which the checker cannot tell apart
        # from misuse. Every other vet analyzer stays on.
        run: go vet -unsafeptr=false ./...

      # The UI Automation engine tests self-skip when the environment cannot host
      # UIA (hosted runners have no interactive desktop session), so this job
      # guarantees compilation plus the pure-logic suites: pkg/inventory,
      # pkg/windows (manifest invariants, param coercion), and internal/winmcp.
      # (The guardrails package suites run in the agentweave-harness repo's CI.)
      # -v keeps those skips visible rather than silent.
      - name: Test
        run: go test ./... -count=1 -v

      # The shipped policy fixtures are executable: run them through the real CLI
      # so a rule change that drops a requirement fails here. bash so the glob
      # expands (pwsh would pass it literally).
      - name: Policy fixtures
        shell: bash
        run: go run ./cmd/windows-mcp-server policy test policy/examples/tests/*.json

      # The shipped journeys are validated (parse + compile to a plan) through the
      # real CLI, so a broken example or a schema change is caught here. `run` needs
      # an interactive desktop and is not exercised in CI.
      - name: Journey examples validate
        shell: bash
        run: |
          for j in journeys/examples/*.json; do
            go run ./cmd/windows-mcp-server journey validate "$j"
          done

      # The `(amd64 || arm64)` build tag is asserted everywhere and verified
      # nowhere; cross-compiling catches arm64-only breakage before release.
      - name: Build (arm64 cross-compile)
        env:
          GOARCH: arm64
        run: go build ./...
