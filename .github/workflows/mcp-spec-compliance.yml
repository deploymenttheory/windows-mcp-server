name: MCP spec gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-gate:
    name: MCP spec gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require the latest published MCP revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-latest-mcp-spec.sh
      - name: Validate the implemented product surface and results
        run: go test ./internal/winmcp ./pkg/windows -run 'TestProductSpecGate|TestProductResultShapesMatchLatestSpec|TestServedSurfaceValidatesAgainstTheNewestRevision' -count=1
