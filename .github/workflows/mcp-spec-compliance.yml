name: mcp | Spec Compliance

# Proves this server conforms to the Model Context Protocol, and keeps that proof
# current as the spec evolves.
#
# The verdict comes from the official suite, github.com/modelcontextprotocol/conformance,
# run against the server itself. It is not self-assessed: this repository previously
# scored its own wire objects against vendored schemas and published the resulting
# 100/100, a number marked by the project it graded.
#
# The suite can only reach a server over HTTP — `--url` is a required option of its
# `server` command and there is no stdio path — so the job builds the server with
# `-tags conformance`, which adds a loopback Streamable HTTP host and nothing else.
# TestConformanceHostServesTheShippedSurface asserts that host serves a manifest and
# capabilities identical to the stdio binary, which is what lets the evidence transfer.
#
# The suite runs twice, and the two results are recorded separately:
#
#   product  — the manifest this server actually ships. Proves the transport and wire
#              conformance the 2026-07-28 revision is about.
#   fixtures — with the suite's named fixture tools registered, so tools/call,
#              resources/read and prompts/get are exercised at all. The fixtures never
#              exist in a released binary.
#
# A third run at 2025-11-25 records backward compatibility.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC. Off the hour to avoid the scheduler's peak-minute backlog.
    - cron: '17 6 * * 1'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/mcp-spec-compliance.yml'
      - 'conformance/**'
      - 'schema/**'
      - 'internal/mcpconf/**'
      - 'internal/mcpspec/**'
      - 'internal/winmcp/**'
      - 'internal/guardrails/**'
      - 'pkg/windows/**'
      - 'go.mod'

permissions:
  contents: read

env:
  # Pinned exactly. 2026-07-28 support landed on the 0.2.0 alpha line; the stable
  # 0.1.x predates the revision entirely. A pre-release must not float — the verdict
  # is only reproducible against a known harness. The "newer harness" step below
  # reports when a later version exists rather than silently adopting it.
  HARNESS_VERSION: '0.2.0-alpha.10'
  SPEC_VERSION: '2026-07-28'
  BACKCOMPAT_SPEC_VERSION: '2025-11-25'
  PRODUCT_PORT: '3001'
  FIXTURES_PORT: '3002'
  BACKCOMPAT_PORT: '3003'

jobs:
  conformance:
    name: '📐 Official MCP conformance suite'
    # Windows-only: nearly every file is //go:build windows, and the server under
    # test is a Windows desktop automation server.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push the evidence branch
      pull-requests: write   # open the evidence PR
      issues: write          # open the tracking issue
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PR runs report only; they must not push branches or file issues.
      MUTATE: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build the conformance host
        run: |
          $ErrorActionPreference = 'Stop'
          # The `conformance` tag adds the loopback HTTP host. A plain build must NOT
          # contain it: that is the guarantee that the released binary is stdio-only.
          go build -tags conformance -o "$env:RUNNER_TEMP/conformance-host.exe" ./cmd/windows-mcp-server
          go build -o "$env:RUNNER_TEMP/released.exe" ./cmd/windows-mcp-server
          $help = & "$env:RUNNER_TEMP/released.exe" --help 2>&1 | Out-String
          if ($help -match 'conformance-serve') {
            throw 'conformance-serve is present in an untagged build; the release binary must have no HTTP listener'
          }
          'release binary has no conformance-serve subcommand'

      - name: Assert the host serves the shipped surface
        # If this fails, nothing below is evidence about the shipped server.
        run: go test -tags conformance ./internal/winmcp/ -run 'ConformanceHost|ConformanceFixtures' -count=1 -v

      # Each pass starts its own host, runs the suite against it, and stops it
      # again — all inside one step, via .github/scripts/run-conformance-pass.ps1.
      #
      # This is not stylistic. A Windows runner terminates a step's process tree
      # when the step ends, so a host started in an earlier step is already gone
      # by the time the suite runs. Every request then comes back "fetch failed"
      # and the suite reports the server as wholly non-conformant — which reads
      # as a catastrophic protocol failure and is actually an empty socket.
      - name: Run the suite — product pass
        id: product
        continue-on-error: true
        run: >
          .github/scripts/run-conformance-pass.ps1
          -Name product
          -HostExe "$env:RUNNER_TEMP/conformance-host.exe"
          -Port $env:PRODUCT_PORT
          -SpecVersion $env:SPEC_VERSION
          -HarnessVersion $env:HARNESS_VERSION
          -Baseline conformance/baseline-product.yml
          -OutputDir "$env:RUNNER_TEMP/results/product"
          -LogDir "$env:RUNNER_TEMP"

      - name: Run the suite — fixtures pass
        id: fixtures
        continue-on-error: true
        run: >
          .github/scripts/run-conformance-pass.ps1
          -Name fixtures -Fixtures
          -HostExe "$env:RUNNER_TEMP/conformance-host.exe"
          -Port $env:FIXTURES_PORT
          -SpecVersion $env:SPEC_VERSION
          -HarnessVersion $env:HARNESS_VERSION
          -Baseline conformance/baseline-fixtures.yml
          -OutputDir "$env:RUNNER_TEMP/results/fixtures"
          -LogDir "$env:RUNNER_TEMP"

      - name: Run the suite — 2025-11-25 backward compatibility
        id: backcompat
        continue-on-error: true
        run: >
          .github/scripts/run-conformance-pass.ps1
          -Name backcompat -Fixtures
          -HostExe "$env:RUNNER_TEMP/conformance-host.exe"
          -Port $env:BACKCOMPAT_PORT
          -SpecVersion $env:BACKCOMPAT_SPEC_VERSION
          -HarnessVersion $env:HARNESS_VERSION
          -Baseline conformance/baseline-backcompat.yml
          -OutputDir "$env:RUNNER_TEMP/results/backcompat"
          -LogDir "$env:RUNNER_TEMP"
      - name: Collect the evidence
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force conformance/results | Out-Null

          # The suite writes each run to results/server-<scenario>-<timestamp>/checks.json.
          # Merge a pass's runs into one checks.json so the committed evidence is one
          # file per pass rather than a directory tree keyed by wall-clock time.
          function Merge-Checks($from, $to) {
            $all = @()
            Get-ChildItem -Path $from -Filter checks.json -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { $all += (Get-Content $_.FullName -Raw | ConvertFrom-Json) }
            if (-not $all) { throw "no checks.json produced under $from" }
            $all | ConvertTo-Json -Depth 20 | Set-Content $to -Encoding utf8
            "$to <- $($all.Count) checks"
          }
          Merge-Checks "$env:RUNNER_TEMP/results/product"   'conformance/results/product-checks.json'
          Merge-Checks "$env:RUNNER_TEMP/results/fixtures"  'conformance/results/fixtures-checks.json'
          Merge-Checks "$env:RUNNER_TEMP/results/backcompat" 'conformance/results/backcompat-checks.json'

      - name: Render the compliance report
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          go run ./cmd/windows-mcp-server conformance-report `
            --pass "product=conformance/results/product-checks.json" `
            --pass "fixtures=conformance/results/fixtures-checks.json" `
            --spec-version $env:SPEC_VERSION --harness-version $env:HARNESS_VERSION `
            --baseline-product conformance/baseline-product.yml `
            --baseline-fixtures conformance/baseline-fixtures.yml `
            --commit '${{ github.sha }}' --generated-at $stamp --run-url $runUrl `
            --format markdown --out docs/mcp-compliance.md `
            --badge-out conformance/badge.json --badge-pass product
          go run ./cmd/windows-mcp-server conformance-report `
            --pass "product=conformance/results/product-checks.json" `
            --pass "fixtures=conformance/results/fixtures-checks.json" `
            --spec-version $env:SPEC_VERSION --harness-version $env:HARNESS_VERSION `
            --baseline-product conformance/baseline-product.yml `
            --baseline-fixtures conformance/baseline-fixtures.yml `
            --commit '${{ github.sha }}' --generated-at $stamp --run-url $runUrl `
            --format json --out conformance/results/report.json

      - name: Job summary
        run: Get-Content docs/mcp-compliance.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/results/
            ${{ runner.temp }}/*.err

      - name: Check for a newer spec revision
        id: sync
        # Informational: it vendors any newly published schema and reports it. A
        # transient GitHub API failure here must not strand the gate below —
        # without this, a TLS timeout in a housekeeping step skips the step that
        # decides whether the server actually conforms.
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'schema/versions.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $known = @($manifest.versions)

          # 'draft' churns continuously and is deliberately not vendored.
          $listing = gh api repos/modelcontextprotocol/modelcontextprotocol/contents/schema | ConvertFrom-Json
          $upstream = @($listing |
            Where-Object { $_.type -eq 'dir' -and $_.name -match '^\d{4}-\d{2}-\d{2}$' } |
            ForEach-Object { $_.name } | Sort-Object)
          if (-not $upstream) { throw 'Upstream returned no revision directories' }

          $new = @($upstream | Where-Object { $known -notcontains $_ })
          foreach ($v in $new) {
            New-Item -ItemType Directory -Force "schema/$v" | Out-Null
            $url = "https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/$v/schema.json"
            Invoke-WebRequest -Uri $url -OutFile "schema/$v/schema.json"
          }
          if ($new) {
            $manifest.versions = @($upstream)
            $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8
          }
          "new_versions=$($new -join ',')" | Out-File $env:GITHUB_OUTPUT -Append
          "newest=$($upstream[-1])"        | Out-File $env:GITHUB_OUTPUT -Append

      - name: Check for a newer conformance harness
        id: harness
        # Same reasoning as the revision check: this only reports, and an npm
        # registry blip must not decide whether the verdict gets evaluated.
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          # Reported, never adopted automatically: a moving harness would make the
          # verdict irreproducible.
          $latest = (npm view '@modelcontextprotocol/conformance' dist-tags --json | ConvertFrom-Json)
          $stable = $latest.latest
          $alpha  = $latest.alpha
          "current: $env:HARNESS_VERSION / latest: $stable / alpha: $alpha"
          $newer = ''
          if ($alpha -and $alpha -ne $env:HARNESS_VERSION) { $newer = $alpha }
          "newer=$newer" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Gate on the suite's verdict
        # Last, so the evidence is always collected, rendered and uploaded even when
        # the verdict is bad. The suite's own exit code is the gate: a failure not in
        # the baseline fails here, and so does a baseline entry that has started
        # passing. Nothing re-derives that judgement.
        run: |
          $failed = @()
          if ('${{ steps.product.outcome }}'   -ne 'success') { $failed += 'product' }
          if ('${{ steps.fixtures.outcome }}'  -ne 'success') { $failed += 'fixtures' }
          if ('${{ steps.backcompat.outcome }}' -ne 'success') { $failed += 'backcompat (2025-11-25)' }
          if ($failed) {
            throw "conformance suite reported unexpected results for: $($failed -join ', '). See docs/mcp-compliance.md and the uploaded artifact."
          }
          'all passes matched their baselines'

      - name: Commit the evidence
        if: env.MUTATE == 'true' && always()
        run: |
          $ErrorActionPreference = 'Stop'
          # `conformance` covers results/ and badge.json — the README badge reads the
          # committed badge.json from the default branch, so it only moves when a run
          # is actually merged.
          git add conformance docs/mcp-compliance.md schema
          if (-not (git diff --cached --name-only)) { 'nothing changed'; exit 0 }

          $newVersions = '${{ steps.sync.outputs.new_versions }}'
          $branch = "chore/mcp-conformance-${{ github.run_id }}"
          $title  = if ($newVersions) { "chore: vendor MCP schema revision(s) $newVersions" }
                    else { 'chore: refresh MCP conformance evidence' }

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git commit -m $title -m 'Automated by .github/workflows/mcp-spec-compliance.yml.'
          git push --set-upstream origin $branch

          $vendored = if ($newVersions) { '`' + $newVersions + '`' }
                      elseif ('${{ steps.sync.outcome }}' -ne 'success') { '_could not check_' }
                      else { '_none_' }
          $newest = '${{ steps.sync.outputs.newest }}'
          $newestLine = if ($newest) { '`' + $newest + '`' } else { '_could not check_' }
          $body = @(
            'Automated MCP conformance run.'
            ''
            "- Suite: ``@modelcontextprotocol/conformance@$env:HARNESS_VERSION``"
            "- Spec revision: ``$env:SPEC_VERSION`` (plus ``$env:BACKCOMPAT_SPEC_VERSION`` for backward compatibility)"
            "- New revision(s) vendored: $vendored"
            "- Newest published upstream: $newestLine"
            ''
            'Per-scenario results are in `docs/mcp-compliance.md`; raw `checks.json` output is under `conformance/results/`.'
          )
          $bodyFile = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          $body | Set-Content $bodyFile -Encoding utf8
          gh pr create --title $title --body-file $bodyFile --base '${{ github.ref_name }}' --head $branch

      - name: Open or update the tracking issue
        if: env.MUTATE == 'true' && always() && (steps.sync.outputs.new_versions != '' || steps.harness.outputs.newer != '' || failure())
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = 'mcp-spec-compliance'
          $title  = 'MCP conformance: action needed'

          $newVersions = '${{ steps.sync.outputs.new_versions }}'
          $newHarness  = '${{ steps.harness.outputs.newer }}'
          $newCell = if ($newVersions) { '`' + $newVersions + '`' } else { '_none_' }
          $harnessCell = if ($newHarness) { '`' + $newHarness + '`' } else { '_none_' }
          # Those checks are allowed to fail without stranding the gate, so their
          # outputs can be absent. Say "could not check" rather than rendering an
          # empty value, which would read as "there is no newer revision".
          $newest = '${{ steps.sync.outputs.newest }}'
          $newestCell = if ($newest) { '`' + $newest + '`' } else { '_could not check_' }
          if ('${{ steps.sync.outcome }}' -ne 'success') { $newCell = '_could not check_' }
          if ('${{ steps.harness.outcome }}' -ne 'success') { $harnessCell = '_could not check_' }

          $body = @(
            "<!-- $marker -->"
            'Automated by `.github/workflows/mcp-spec-compliance.yml` (run ${{ github.run_id }}).'
            ''
            '| | |'
            '|---|---|'
            "| Spec revision run against | ``$env:SPEC_VERSION`` |"
            "| Newest published upstream | $newestCell |"
            "| New revision(s) this run | $newCell |"
            "| Harness in use | ``$env:HARNESS_VERSION`` |"
            "| Newer harness available | $harnessCell |"
            '| product pass | `${{ steps.product.outcome }}` |'
            '| fixtures pass | `${{ steps.fixtures.outcome }}` |'
            '| backcompat pass | `${{ steps.backcompat.outcome }}` |'
            ''
            'A failed pass means the suite reported a failure that is not in the matching'
            'baseline, or a baseline entry that has started passing. Both need a human:'
            'the first is a regression, the second a stale excuse to delete.'
            ''
            'Full report: `docs/mcp-compliance.md`. Workflow run:'
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          )
          $bodyFile = Join-Path $env:RUNNER_TEMP 'issue-body.md'
          $body | Set-Content $bodyFile -Encoding utf8

          $existing = gh issue list --state open --search "$marker in:body" --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment $existing --body-file $bodyFile
          } else {
            gh issue create --title $title --body-file $bodyFile
          }
