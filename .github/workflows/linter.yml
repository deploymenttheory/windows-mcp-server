name: Linter

on:
  pull_request:
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  packages: read
  statuses: write # To report GitHub Actions status checks
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Lint Code Base with Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: origin/main
          VALIDATE_ALL_CODEBASE: false # tells the linter to only check files that have been modified in the current pull request
          # Go validation is handled by go-lint.yml, which runs golangci-lint on a
          # *Windows* runner with this repo's .golangci.yml. Super-linter is a Docker
          # action and can only run on Linux, where almost the whole codebase is
          # excluded by `//go:build windows` tags — so its Go validators duplicated
          # go-lint.yml while analysing far less, and reported failures that the
          # authoritative job did not.
          VALIDATE_GO: false
          VALIDATE_GOFMT: false
          VALIDATE_GOCYCLO: false
          VALIDATE_GOVET: false
          VALIDATE_GOLANGCI_LINT: false
          VALIDATE_CPD: false # Disable CPD (Copy Paste Detection) for all languages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # To report GitHub Actions status checks
          FILTER_REGEX_EXCLUDE: |
            .*\.md$|                # Exclude all markdown files
            .*test/.*|              # Exclude all files in any test directory
            .*_test\.go$|           # Exclude Go test files (e.g., *_test.go)
            .*\.json$               # Exclude all JSON files
