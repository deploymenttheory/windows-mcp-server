name: Linter

on:
  pull_request:
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  packages: read
  statuses: write # To report GitHub Actions status checks
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Lint Code Base with Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: origin/main
          VALIDATE_ALL_CODEBASE: false # tells the linter to only check files that have been modified in the current pull request
          # IMPORTANT: super-linter runs in allow-list mode only while at least one
          # VALIDATE_* is true; if every entry is false it flips to deny-list mode
          # and runs *every* remaining validator (Biome, Checkov, Zizmor, JSCPD,
          # Prettier...). So this must name what to run, never what to skip.
          #
          # Go is deliberately absent: go-lint.yml runs golangci-lint on a Windows
          # runner with this repo's .golangci.yml. Super-linter is a Docker action
          # restricted to Linux, where almost the whole codebase is hidden behind
          # `//go:build windows` tags — it duplicated that job while analysing far
          # less, and failed where the authoritative one passed.
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_CPD: false # Disable CPD (Copy Paste Detection) for all languages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # To report GitHub Actions status checks
          FILTER_REGEX_EXCLUDE: |
            .*\.md$|                # Exclude all markdown files
            .*test/.*|              # Exclude all files in any test directory
            .*_test\.go$|           # Exclude Go test files (e.g., *_test.go)
            .*\.json$               # Exclude all JSON files
